name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rebuild daily so the coding-profile counts stay current without a commit.
  # The counts are fetched at build time because LeetCode's API cannot be
  # called from the browser (no CORS) - see scripts/fetch-coding-stats.mjs.
  schedule:
    - cron: '17 3 * * *'
  # Lets you refresh the counts on demand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Test stats parsers
        run: npm test

      - name: Refresh coding-profile counts
        # Never blocks the deploy: the script keeps the last committed values
        # if a platform is unreachable and always exits 0.
        run: npm run stats

      - run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # Pull requests get the build and tests only, no deploy.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
