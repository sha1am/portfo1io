  <script>
    (function () {
      var repo = 'portfo1io';
      var parts = window.location.pathname.split('/');
      var onProjectPages = window.location.hostname.endsWith('github.io') && parts[1] === repo;
      var base = onProjectPages ? '/' + repo + '/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>

  <script>
    (function () {
      var location = window.location;
      if (location.search.length > 1 && location.search[1] === '/') {
        var decodedPath = location.search
          .slice(1)
          .split('&')
          .map(function (segment) {
            return segment.replace(/~and~/g, '&');
          })
          .join('?');

        window.history.replaceState(
          null,
          '',
          location.pathname.replace(/\/$/, '') + decodedPath + location.hash
        );
      }
    })();
  </script>

  <!--
    Applies the saved theme before first paint so the page never flashes
    the wrong colours. Must stay inline and stay in <head>.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
